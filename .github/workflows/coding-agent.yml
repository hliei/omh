name: Coding agent

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            coding_agent/pyproject.toml
      - name: Install SDK and application dependencies
        run: |
          python -m pip install .
          python -m pip install -e "coding_agent[dev]"
      - name: Lint
        working-directory: coding_agent
        run: python -m ruff check src tests
      - name: Type check
        working-directory: coding_agent
        run: python -m mypy
      - name: Offline tests
        working-directory: coding_agent
        run: python -m pytest

  package:
    name: Application package verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build both sdists and wheels
        run: |
          python -m pip install build
          python -m build --outdir dist/sdk
          python -m build coding_agent --outdir coding_agent/dist
      - name: Verify independent distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from email.parser import Parser
          import tarfile
          import zipfile

          sdk = next(Path("dist/sdk").glob("*.whl"))
          app = next(Path("coding_agent/dist").glob("*.whl"))
          sdk_names = zipfile.ZipFile(sdk).namelist()
          app_names = zipfile.ZipFile(app).namelist()
          assert not any(name.startswith("coding_agent/") for name in sdk_names)
          assert "omh/py.typed" in sdk_names
          assert "omh/session_backends/sqlite/migrations/001_initial.sql" in sdk_names
          assert "coding_agent/py.typed" in app_names
          assert {
              "coding_agent/agent_session.py",
              "coding_agent/agent_session_runtime.py",
              "coding_agent/cli.py",
              "coding_agent/model_directory.py",
              "coding_agent/session_manager.py",
          } <= set(app_names)
          assert "coding_agent/runtime.py" not in app_names
          assert not any(name.startswith(("omh/", "tests/", ".scratch/", "examples/")) for name in app_names)
          app_entry_points = next(
              name for name in app_names if name.endswith(".dist-info/entry_points.txt")
          )
          assert "omh = coding_agent.cli:main" in zipfile.ZipFile(app).read(app_entry_points).decode()
          assert not any(name.endswith(".dist-info/entry_points.txt") for name in sdk_names)
          metadata_name = next(name for name in app_names if name.endswith(".dist-info/METADATA"))
          metadata = Parser().parsestr(zipfile.ZipFile(app).read(metadata_name).decode())
          assert any(value.startswith("omh<") for value in metadata.get_all("Requires-Dist", []))
          for archive_path in Path("coding_agent/dist").glob("*.tar.gz"):
              names = tarfile.open(archive_path).getnames()
              assert any(name.endswith("src/coding_agent/py.typed") for name in names)
              assert not any("/src/omh/" in name or "/.scratch/" in name for name in names)
          PY
      - name: Install built wheels and application test tooling
        run: |
          python -m pip install dist/sdk/*.whl
          python - <<'PY'
          from importlib.metadata import distribution
          import shutil
          assert not distribution("omh").entry_points
          assert shutil.which("omh") is None
          PY
          python -m pip install coding_agent/dist/*.whl
          python -m pip install "omh-coding-agent[dev]"
      - name: Test installation outside repository
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from dataclasses import fields
          import omh
          import coding_agent
          from coding_agent import AgentSession, AgentSessionRuntime, SessionManager
          from omh.agent import AgentEndEvent, estimate_history_tokens
          from omh.llm.types import Usage
          assert AgentSession.__module__ == "coding_agent.agent_session"
          assert AgentSessionRuntime.__module__ == "coding_agent.agent_session_runtime"
          assert SessionManager.__module__ == "coding_agent.session_manager"
          assert "site-packages" in str(Path(omh.__file__))
          assert "site-packages" in str(Path(coding_agent.__file__))
          assert "will_retry" in {field.name for field in fields(AgentEndEvent)}
          assert "reported" in {field.name for field in fields(Usage)}
          assert callable(estimate_history_tokens)
          PY
          omh --version
          omh --help > /dev/null
          omh --list-models
          python -m pytest "$GITHUB_WORKSPACE/coding_agent/tests" -c "$GITHUB_WORKSPACE/coding_agent/pyproject.toml"
          python "$GITHUB_WORKSPACE/coding_agent/examples/long_conversation.py"
