name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-quality:
    name: SDK quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

  package:
    name: Package verification
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check distribution contents
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          wheel_names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "omh/py.typed",
              "omh/durable/__init__.py",
              "omh/durable/runtime/__init__.py",
              "omh/durable/session/__init__.py",
              "omh/session_backends/sqlite/migrations/001_initial.sql",
          }
          missing = sorted(required - wheel_names)
          if missing:
              sys.exit(f"{wheel} is missing: {missing}")

          unexpected = sorted(
              name
              for name in wheel_names
              if name.startswith(("tests/", "docs/", "examples/", "omh/agent/durable/"))
          )
          if unexpected:
              sys.exit(f"{wheel} contains unexpected entries: {unexpected}")

          sdist_names = set(tarfile.open(sdist).getnames())
          if not any(name.endswith("src/omh/py.typed") for name in sdist_names):
              sys.exit(f"{sdist} is missing src/omh/py.typed")

          print(f"{wheel}: {len(wheel_names)} entries, contents verified")
          print(f"{sdist}: {len(sdist_names)} entries, contents verified")
          PY

      # Provides pytest; versions come from the dev extra so they are not declared twice.
      - name: Install test tooling
        run: python -m pip install -e ".[dev]"

      # The editable install is only a .pth pointer; swap it for the artifact under test.
      - name: Swap the editable install for the built wheel
        run: |
          python -m pip uninstall --yes omh
          python -m pip install dist/*.whl

      # The src layout keeps the source tree off sys.path, so this proves the wheel is exercised.
      - name: Test the built wheel
        run: |
          python -c "import pathlib, omh; assert 'site-packages' in str(pathlib.Path(omh.__file__)), omh.__file__"
          python -m pytest
